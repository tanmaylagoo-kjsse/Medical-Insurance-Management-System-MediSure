<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Individual Plans</title>
<style>
body{font-family:Inter;background:#f8fafc;margin:0;}
header{padding:15px 40px;background:white;border-bottom:1px solid #e2e8f0;}
.container{padding:40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;}
button{margin-top:10px;width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px;}
</style>
</head>
<body>

<header><h2>Individual Plans</h2></header>

<div class="container">
<div class="grid">

<div class="card"><h3>HDFC Ergo</h3><p>Basic coverage</p><b>INR5000/year</b><button>Buy</button></div>
<div class="card"><h3>ICICI Lombard</h3><p>Affordable plans</p><b>INR4500/year</b><button>Buy</button></div>
<div class="card"><h3>Star Health</h3><p>Wide coverage</p><b>INR5800/year</b><button>Buy</button></div>

</div>
</div>

</body>
</html>
