<!DOCTYPE html>
<html>
<head>
<title>Senior Plans</title>
<style>
body{font-family:Inter;background:#f8fafc;margin:0;}
header{padding:15px 40px;background:white;border-bottom:1px solid #e2e8f0;}
.container{padding:40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;}
button{margin-top:10px;width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px;}
</style>
</head>
<body>

<header><h2>Senior Citizen Plans</h2></header>

<div class="container">
<div class="grid">

<div class="card"><h3>Star Health</h3><p>Special senior healthcare plan</p><b>INR15,000/year</b><button>Buy</button></div>
<div class="card"><h3>Religare Care</h3><p>Low waiting period plans</p><b>INR13,500/year</b><button>Buy</button></div>
<div class="card"><h3>ICICI Lombard</h3><p>Comprehensive senior coverage</p><b>INR14,200/year</b><button>Buy</button></div>

</div>
</div>

</body>
</html>
