<!DOCTYPE html>
<html>
<head>
<title>Travel Insurance</title>
<style>
body{font-family:Inter;background:#f8fafc;margin:0;}
header{padding:15px 40px;background:white;border-bottom:1px solid #e2e8f0;}
.container{padding:40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;}
button{margin-top:10px;width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px;}
</style>
</head>
<body>

<header><h2>Travel Insurance Plans</h2></header>

<div class="container">
<div class="grid">

<div class="card"><h3>Reliance General</h3><p>Worldwide coverage</p><b>₹2,000/trip</b><button>Buy</button></div>
<div class="card"><h3>ICICI Travel</h3><p>Emergency medical coverage</p><b>₹2,500/trip</b><button>Buy</button></div>
<div class="card"><h3>Tata AIG Travel</h3><p>Student & business plans</p><b>₹2,200/trip</b><button>Buy</button></div>

</div>
</div>

</body>
</html>
