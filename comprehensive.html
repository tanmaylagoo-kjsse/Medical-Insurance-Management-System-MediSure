<body>

<header><h2>Comprehensive Health Plans</h2></header>

<div class="container">
<div class="grid">

<div class="card"><h3>Aditya Birla</h3><p>All-in-one coverage</p><b>₹10,000/year</b><button>Buy</button></div>
<div class="card"><h3>HDFC Ergo</h3><p>Premium full coverage</p><b>₹11,500/year</b><button>Buy</button></div>
<div class="card"><h3>Care Supreme</h3><p>Unlimited benefits plan</p><b>₹12,000/year</b><button>Buy</button></div>

</div>
</div>

</body>
</html>
